# RentLoop — Nginx reverse proxy
# Place at: /etc/nginx/sites-available/rentloop
# Enable:   ln -s /etc/nginx/sites-available/rentloop /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.yourdomain.co.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.yourdomain.co.ke;

    # Managed by certbot
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.co.ke/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options        DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection       "1; mode=block";

    # Pass real client IP to Go — required for Safaricom IP validation
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header Host             $host;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}