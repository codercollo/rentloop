<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{block "title" .}}RentLoop Admin{{end}}</title>
  <link rel="stylesheet" href="/static/css/admin.css">
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased flex min-h-screen">

<aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col fixed h-full">
  <div class="p-5 border-b border-gray-800">
    <span class="text-lg font-bold text-indigo-400">RentLoop</span>
    <p class="text-xs text-gray-500 mt-0.5">Admin Panel</p>
  </div>
  <nav class="flex-1 p-3 space-y-1">
    {{$path := .Path}}
    {{range .Nav}}
    <a href="{{.URL}}"
       class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition
              {{if eq $path .URL}}bg-indigo-500/20 text-indigo-400 font-medium
              {{else}}text-gray-400 hover:bg-gray-800 hover:text-white{{end}}">
      <span>{{.Icon}}</span>{{.Label}}
    </a>
    {{end}}
  </nav>
  <div class="p-3 border-t border-gray-800">
    <form method="POST" action="/admin/logout">
      <button class="w-full text-left px-3 py-2 text-sm text-gray-500 hover:text-red-400 rounded-lg hover:bg-gray-800 transition">
        ← Sign out
      </button>
    </form>
  </div>
</aside>

<main class="ml-56 flex-1 p-8">
  {{block "content" .}}{{end}}
</main>

</body>
</html>
