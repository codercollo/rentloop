<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentLoop — {{if .Setup}}Create Admin{{else}}Login{{end}}</title>
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="bg-gray-950 text-gray-100 flex items-center justify-center min-h-screen">
<div class="w-full max-w-sm">
  <div class="text-center mb-8">
    <h1 class="text-2xl font-bold text-indigo-400">RentLoop</h1>
    <p class="text-gray-500 text-sm mt-1">{{if .Setup}}Create Admin Account{{else}}Admin Panel{{end}}</p>
  </div>
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8">
    {{if .Error}}
    <div class="mb-4 px-4 py-3 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-lg">
      {{.Error}}
    </div>
    {{end}}

    {{if .Setup}}
    {{/* ── One-time setup form ── */}}
    <form method="POST" action="/admin/setup?secret={{.Secret}}" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Email</label>
        <input type="email" name="email" required autofocus
               class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500 transition">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Password</label>
        <input type="password" name="password" required minlength="8"
               class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500 transition">
      </div>
      <button type="submit"
              class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium text-sm transition mt-2">
        Create admin account
      </button>
    </form>
    {{else}}
    {{/* ── Login form ── */}}
    <form method="POST" action="/admin/login" class="space-y-4">
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Email</label>
        <input type="email" name="email" required autofocus
               class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500 transition">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1.5">Password</label>
        <input type="password" name="password" required
               class="w-full px-4 py-2.5 bg-gray-800 border border-gray-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500 transition">
      </div>
      <button type="submit"
              class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium text-sm transition mt-2">
        Sign in
      </button>
    </form>
    {{end}}
  </div>
</div>
</body>
</html>
